[build-system]
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#declaring-the-build-backend

# A list of dependencies needed to build the project.
requires = [
    "setuptools>=77",  # https://setuptools.pypa.io/en/latest/userguide/index.html
    "Cython>=3",  # https://cython.readthedocs.io/en/latest/index.html
]

# The build backend to be used.
build-backend = "setuptools.build_meta"


[dependency-groups]
# This specification defines dependency groups, a mechanism for storing package
# requirements in pyproject.toml files such that they are not included in
# project metadata when it is built.
# https://packaging.python.org/en/latest/specifications/dependency-groups/#the-dependency-groups-table
# https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups

dev = [
    "cibuildwheel",  # https://cibuildwheel.pypa.io/en/stable/
    "Cython",  # https://cython.readthedocs.io/en/latest/index.html
    "pytest",  # https://docs.pytest.org/en/stable/
    "Sphinx",  # https://www.sphinx-doc.org/en/master/index.html
    "stubgen-pyx>=0.3.0",  # https://github.com/jon-edward/stubgen-pyx
]


[project]
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# A list of PyPI classifiers that apply to your project
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

# Put the name of your project on PyPI.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#name
name = "ringing-lib"

# Put the version of your project.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#version
version = "0.5.1"

# This lets you declare the minimum version of Python that you support
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#python-requires
requires-python = ">=3.11"

# Lists of people identified by a name and/or an email address
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#authors-maintainers
authors = [{ name = "Leigh Simpson", email = "code@simpleigh.com" }]

# This should be a one-line description of your project, to show as the
# “headline” of your project page on PyPI.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#description
description = "Python wrapper for the Ringing Class Library"

# This is a longer description of your project, to display on your project page
# on PyPI.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#readme
readme = "README.rst"

# The new format for license is a valid SPDX license expression consisting of
# one or more license identifiers.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license
license = "GPL-3.0-or-later"


[project.urls]
# A list of URLs associated with your project
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#urls

Documentation = "https://ringing-lib-python.readthedocs.io/"
Homepage = "https://ringing-lib.github.io/"
Issues = "https://github.com/ringing-lib/ringing-lib-python/issues"
Repository = "https://github.com/ringing-lib/ringing-lib-python"


[tool.cibuildwheel]
# https://cibuildwheel.pypa.io/en/stable/options/

# Build customization

# Set the tool to use to build, either "build" (default), "build[uv]", or "pip".
# https://cibuildwheel.pypa.io/en/stable/options/#build-frontend
build-frontend = "build[uv]"

# Execute a shell command on the build system before any wheels are built.
# https://cibuildwheel.pypa.io/en/stable/options/#before-all
before-all = "./build-lib.sh"

# Testing

# The command to test each built wheel.
# https://cibuildwheel.pypa.io/en/stable/options/#testing
test-command = "pytest"

# Paths that are copied into the working directory of the tests.
# https://cibuildwheel.pypa.io/en/stable/options/#test-sources
test-sources = ["tests"]

# Specify test dependencies from your project's `dependency-groups`.
# https://cibuildwheel.pypa.io/en/stable/options/#test-groups
test-groups = ["dev"]


[tool.setuptools]
# https://setuptools.pypa.io/en/latest/userguide/index.html

# https://setuptools.pypa.io/en/latest/userguide/datafiles.html#include-package-data
include-package-data = false

# https://setuptools.pypa.io/en/latest/userguide/package_discovery.html#custom-discovery
packages = ["ringing"]
