name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get install libreadline8t64 libgdome2-0
          wget https://github.com/ringing-lib/ringing-lib-deb/releases/download/v0.4.0-6/libringing-dev_0.4.0-6_amd64.deb
          sudo dpkg --install libringing-dev_0.4.0-6_amd64.deb

      - run: make build

      - run: make check

      - run: make docs
